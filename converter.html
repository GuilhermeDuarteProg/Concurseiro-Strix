<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor Strix - PDF/Texto para JSON</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #6366f1;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: #fff; margin-bottom: 0.5rem; }
    p { color: var(--text-muted); }
    
    .grid-input {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin: 1.5rem 0;
    }
    @media(max-width: 768px) { .grid-input { grid-template-columns: 1fr; } }

    .box {
      background: var(--card);
      border: 2px dashed var(--border);
      padding: 1.5rem;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .box:hover { border-color: var(--primary); }
    input[type="file"] { display: none; }
    
    textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.75rem;
      border-radius: 8px;
      box-sizing: border-box;
      font-family: inherit;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 0.5rem;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .q-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .q-header {
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 0.5rem;
      font-size: 1.2rem;
    }
    .opt-grid { display: grid; gap: 0.5rem; margin-top: 0.5rem; }
    .opt-row { display: flex; align-items: center; gap: 0.5rem; }
    .opt-label { font-weight: bold; width: 25px; }
  </style>
</head>
<body>

<div class="container">
  <h1>🛠️ Conversor Strix: Prova ➔ JSON</h1>
  <p>Escolha como deseja importar sua prova da Cesgranrio / Transpetro:</p>

  <div class="grid-input">
    <!-- OPÇÃO 1: PDF -->
    <div class="box" onclick="document.getElementById('pdfInput').click()">
      <h3>📄 Opção 1: Enviar PDF</h3>
      <p id="status">Clique aqui para selecionar o arquivo PDF</p>
      <input type="file" id="pdfInput" accept="application/pdf">
    </div>

    <!-- OPÇÃO 2: COLI TEXTO -->
    <div style="background: var(--card); padding: 1rem; border-radius: 12px; border: 1px solid var(--border);">
      <h3>📋 Opção 2: Cole o Texto da Prova</h3>
      <textarea id="rawTextInput" rows="4" placeholder="Abra o PDF, selecione todo o texto (Ctrl+A), copie (Ctrl+C) e cole aqui..."></textarea>
      <button class="btn" onclick="processRawText(document.getElementById('rawTextInput').value)" style="width: 100%;">Convert Texto Colado</button>
    </div>
  </div>

  <!-- TEXTO EXTRAÍDO BRUTO -->
  <details style="margin-bottom: 1.5rem; background: var(--card); padding: 0.5rem 1rem; border-radius: 8px;">
    <summary style="cursor: pointer; color: var(--primary); font-weight: bold;">🔍 Ver Texto Bruto Extraído do PDF</summary>
    <textarea id="extractedDebug" rows="6" readonly style="margin-top: 0.5rem; font-size: 0.8rem;"></textarea>
  </details>

  <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 2rem; justify-content: space-between;">
    <button id="downloadBtn" class="btn" disabled>💾 Baixar questoes.json</button>
    <span id="counterInfo" style="color: var(--text-muted); font-weight: bold;"></span>
  </div>

  <div id="previewArea"></div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let parsedQuestions = [];

// 1. PROCESSAR ARQUIVO PDF
document.getElementById('pdfInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  document.getElementById('status').innerText = `⏳ Lendo ${file.name}...`;
  
  try {
    const rawText = await extractPDFText(file);
    document.getElementById('extractedDebug').value = rawText;

    if (!rawText || rawText.trim().length < 50) {
      alert("⚠️ O PDF não contém texto selecionável (pode ser uma imagem/escaneamento). Tente usar a Opção 2 (Copiar e Colar o texto).");
      document.getElementById('status').innerText = "❌ PDF sem texto selecionável.";
      return;
    }

    processRawText(rawText);
    document.getElementById('status').innerText = `✅ Sucesso: ${file.name}`;
  } catch (err) {
    console.error(err);
    alert("Erro ao ler o arquivo PDF.");
  }
});

// 2. EXTRAÇÃO RESPEITANDO DUAS COLUNAS
async function extractPDFText(file) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let fullText = "";

  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 1.0 });
    const textContent = await page.getTextContent();
    const midX = viewport.width / 2;

    const items = textContent.items
      .map(it => ({ str: it.str, x: it.transform[4], y: it.transform[5] }))
      .filter(it => it.str.trim() !== '');

    if (items.length === 0) continue;

    const leftCol = items.filter(it => it.x < midX);
    const rightCol = items.filter(it => it.x >= midX);

    function processCol(colItems) {
      if (!colItems.length) return "";
      colItems.sort((a, b) => b.y - a.y || a.x - b.x);
      
      const lines = [];
      let curLine = [];
      let lastY = null;

      for (const it of colItems) {
        if (lastY === null || Math.abs(it.y - lastY) <= 4) {
          curLine.push(it);
        } else {
          lines.push(curLine);
          curLine = [it];
        }
        lastY = it.y;
      }
      if (curLine.length) lines.push(curLine);

      return lines.map(l => l.sort((a,b) => a.x - b.x).map(i => i.str).join(' ')).join('\n');
    }

    fullText += processCol(leftCol) + "\n" + processCol(rightCol) + "\n\n";
  }
  return fullText;
}

// 3. PARSER SUPER ULTRA-FLEXÍVEL
function processRawText(rawText) {
  if (!rawText || rawText.trim().length === 0) {
    alert("Cole ou carregue algum texto primeiro!");
    return;
  }

  // Limpeza inicial
  const text = rawText.replace(/\r/g, '');

  // Detecta padrões de início de questão: "QUESTÃO 1", "QUESTÃO 01", "1.", "01 -", "1)"
  const qRegex = /(?:^|\n)\s*(?:QUESTÃO\s+(\d{1,3})|(\d{1,3})\s*[\.\)\-:]\s+)/gi;
  let match;
  const blocks = [];

  while ((match = qRegex.exec(text)) !== null) {
    const num = parseInt(match[1] || match[2], 10);
    if (num >= 1 && num <= 120) {
      blocks.push({
        num: num,
        index: match.index,
        headerLength: match[0].length
      });
    }
  }

  if (blocks.length === 0) {
    alert("Não foi possível identificar o número das questões no texto. Certifique-se de que existem marcadores como 'QUESTÃO 1' ou '1.'");
    return;
  }

  parsedQuestions = [];
  let currentSupportText = "";

  for (let i = 0; i < blocks.length; i++) {
    const cur = blocks[i];
    const nextIdx = blocks[i+1] ? blocks[i+1].index : text.length;
    const chunk = text.substring(cur.index + cur.headerLength, nextIdx).trim();

    // Detecta textos de apoio (ex: TEXTO I, LEIA O TEXTO)
    const textHeaderMatch = chunk.match(/(TEXTO\s+[I|V|X\d]+[\s\S]*?)(?=\n\s*[A-Z0-9\s]{3,}\n|\n\s*Questão|\n\s*\(?[A-E]\)?)/i);
    let statementAndOptions = chunk;
    
    if (textHeaderMatch) {
      currentSupportText = textHeaderMatch[1].trim();
      statementAndOptions = chunk.replace(textHeaderMatch[1], '').trim();
    }

    // Identifica alternativas (A, B, C, D, E)
    const optRegex = /(?:^|\n|\s+)(?:\(([A-E])\)|([A-E])\s*[\.\)\-])\s+/g;
    let optMatch;
    const optPositions = [];

    while ((optMatch = optRegex.exec(statementAndOptions)) !== null) {
      const letter = (optMatch[1] || optMatch[2]).toUpperCase();
      optPositions.push({ letter, index: optMatch.index, len: optMatch[0].length });
    }

    let enunciado = statementAndOptions;
    const options = { a: "", b: "", c: "", d: "", e: "" };

    if (optPositions.length >= 2) {
      enunciado = statementAndOptions.substring(0, optPositions[0].index).trim();

      for (let j = 0; j < optPositions.length; j++) {
        const curOpt = optPositions[j];
        const nextOptIdx = optPositions[j+1] ? optPositions[j+1].index : statementAndOptions.length;
        const optText = statementAndOptions.substring(curOpt.index + curOpt.len, nextOptIdx).trim();
        const key = curOpt.letter.toLowerCase();
        if (options[key] === "") {
          options[key] = optText.replace(/\s+/g, ' ');
        }
      }
    }

    parsedQuestions.push({
      id: cur.num,
      texto_apoio: currentSupportText,
      enunciado: enunciado.replace(/\s+/g, ' '),
      alternativas: options,
      resposta_correta: ""
    });
  }

  // Remove duplicados mantendo a ordem
  const unique = [];
  const seen = new Set();
  for (const q of parsedQuestions) {
    if (!seen.has(q.id)) {
      seen.add(q.id);
      unique.push(q);
    }
  }

  parsedQuestions = unique.sort((a,b) => a.id - b.id);

  document.getElementById('counterInfo').innerText = `Total: ${parsedQuestions.length} Questões Extraídas`;
  document.getElementById('downloadBtn').disabled = false;
  renderPreview();
}

// 4. RENDERIZAR PAINEL DE EDIÇÃO/REVISÃO
function renderPreview() {
  const container = document.getElementById('previewArea');
  container.innerHTML = "";

  parsedQuestions.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.innerHTML = `
      <div class="q-header">Questão ${q.id}</div>
      
      ${q.texto_apoio ? `
        <label style="font-size:0.85rem; color:#818cf8; font-weight:bold;">Texto de Interpretação / Apoio:</label>
        <textarea rows="4" onchange="parsedQuestions[${idx}].texto_apoio = this.value">${q.texto_apoio}</textarea>
      ` : ''}

      <label style="font-size:0.85rem; color:var(--text-muted); font-weight:bold;">Enunciado:</label>
      <textarea rows="3" onchange="parsedQuestions[${idx}].enunciado = this.value">${q.enunciado}</textarea>

      <div class="opt-grid">
        ${['a','b','c','d','e'].map(letter => `
          <div class="opt-row">
            <span class="opt-label">${letter.toUpperCase()})</span>
            <input type="text" style="flex:1; background:#0f172a; border:1px solid var(--border); color:#fff; padding:0.4rem; border-radius:4px;" 
                   value="${q.alternativas[letter] || ''}" 
                   onchange="parsedQuestions[${idx}].alternativas['${letter}'] = this.value">
          </div>
        `).join('')}
      </div>
    `;
    container.appendChild(card);
  });
}

// 5. DOWNLOAD DO ARQUIVO JSON
document.getElementById('downloadBtn').addEventListener('click', () => {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(parsedQuestions, null, 2));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", "questoes.json");
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
});
</script>
</body>
</html>
