<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor Strix - PDF para JSON</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #6366f1;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: #fff; margin-bottom: 0.5rem; }
    p { color: var(--text-muted); }
    
    .box {
      background: var(--card);
      border: 2px dashed var(--border);
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      margin: 1.5rem 0;
      cursor: pointer;
    }
    .box:hover { border-color: var(--primary); }
    input[type="file"] { display: none; }
    
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .q-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .q-header {
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 0.5rem;
      font-size: 1.2rem;
    }
    textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.5rem;
      border-radius: 6px;
      box-sizing: border-box;
      font-family: inherit;
      margin-bottom: 0.5rem;
    }
    .opt-grid {
      display: grid;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .opt-row { display: flex; align-items: center; gap: 0.5rem; }
    .opt-label { font-weight: bold; width: 25px; }
  </style>
</head>
<body>

<div class="container">
  <h1>🛠️ Conversor Strix: PDF ➔ JSON</h1>
  <p>Carregue o PDF da prova (Cesgranrio / Transpetro). O leitor ignorará a capa, separará os textos de interpretação e organizará as questões.</p>

  <div class="box" onclick="document.getElementById('pdfInput').click()">
    <p id="status">📁 Clique ou arraste o PDF da PROVA aqui</p>
    <input type="file" id="pdfInput" accept="application/pdf">
  </div>

  <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 2rem;">
    <button id="downloadBtn" class="btn" disabled>💾 Baixar questoes.json</button>
    <span id="counterInfo" style="color: var(--text-muted);"></span>
  </div>

  <div id="previewArea"></div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let parsedQuestions = [];

document.getElementById('pdfInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  document.getElementById('status').innerText = `⏳ Extraindo texto de ${file.name}...`;
  
  try {
    const rawText = await extractPDFText(file);
    parsedQuestions = parseCesgranrioPDF(rawText);
    
    if (parsedQuestions.length === 0) {
      alert("Nenhuma questão foi encontrada. Verifique se o PDF contém texto selecionável.");
      document.getElementById('status').innerText = "❌ Erro ao identificar questões.";
      return;
    }

    document.getElementById('status').innerText = `✅ Sucesso! ${parsedQuestions.length} questões extraídas.`;
    document.getElementById('counterInfo').innerText = `Total: ${parsedQuestions.length} questões`;
    document.getElementById('downloadBtn').disabled = false;
    
    renderPreview();
  } catch (err) {
    console.error(err);
    alert("Erro ao ler o PDF.");
  }
});

// 1. EXTRAÇÃO RESPEITANDO DUAS COLUNAS
async function extractPDFText(file) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let fullText = "";

  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 1.0 });
    const textContent = await page.getTextContent();
    const midX = viewport.width / 2;

    const items = textContent.items
      .map(it => ({ str: it.str, x: it.transform[4], y: it.transform[5] }))
      .filter(it => it.str.trim() !== '');

    if (items.length === 0) continue;

    const leftCol = items.filter(it => it.x < midX);
    const rightCol = items.filter(it => it.x >= midX);

    function processCol(colItems) {
      if (!colItems.length) return "";
      colItems.sort((a, b) => b.y - a.y || a.x - b.x);
      
      const lines = [];
      let curLine = [];
      let lastY = null;

      for (const it of colItems) {
        if (lastY === null || Math.abs(it.y - lastY) <= 4) {
          curLine.push(it);
        } else {
          lines.push(curLine);
          curLine = [it];
        }
        lastY = it.y;
      }
      if (curLine.length) lines.push(curLine);

      return lines.map(l => l.sort((a,b) => a.x - b.x).map(i => i.str).join(' ')).join('\n');
    }

    fullText += processCol(leftCol) + "\n" + processCol(rightCol) + "\n\n";
  }
  return fullText;
}

// 2. PARSER ESPECÍFICO CESGRANRIO (IGNORA CAPA E EXTRAI TEXTOS DE APOIO)
function parseCesgranrioPDF(text) {
  // Ignora a capa procurando a primeira ocorrência de QUESTÃO 01 / QUESTÃO 1
  const firstQMatch = text.match(/QUESTÃO\s+0?1\b/i);
  let cleanText = text;
  
  if (firstQMatch) {
    // Mantém o texto um pouco antes da Questão 1 caso haja um TEXTO I antes dela
    const startIndex = Math.max(0, firstQMatch.index - 2000);
    cleanText = text.substring(startIndex);
  }

  // Divide o texto onde houver "QUESTÃO X"
  const qRegex = /(?:^|\n)\s*QUESTÃO\s+(\d{1,3})\b/gi;
  let match;
  const blocks = [];

  while ((match = qRegex.exec(cleanText)) !== null) {
    blocks.push({
      num: parseInt(match[1], 10),
      index: match.index,
      headerLength: match[0].length
    });
  }

  const questions = [];
  let currentSupportText = "";

  for (let i = 0; i < blocks.length; i++) {
    const cur = blocks[i];
    const nextIdx = blocks[i+1] ? blocks[i+1].index : cleanText.length;
    
    // Trecho bruto entre esta questão e a próxima
    const chunk = cleanText.substring(cur.index + cur.headerLength, nextIdx).trim();

    // Verifica se há um novo texto de interpretação dentro deste bloco (ex: TEXTO I, LEIA O TEXTO)
    const textHeaderMatch = chunk.match(/(TEXTO\s+[I|V|X\d]+[\s\S]*?)(?=\n\s*[A-Z0-9\s]{3,}\n|\n\s*Questão|\n\s*\(?[A-E]\)?)/i);
    
    let statementAndOptions = chunk;
    if (textHeaderMatch) {
      currentSupportText = textHeaderMatch[1].trim();
      // Remove o texto de interpretação do corpo direto do enunciado
      statementAndOptions = chunk.replace(textHeaderMatch[1], '').trim();
    }

    // Separar alternativas (A, B, C, D, E)
    const optRegex = /(?:^|\n)\s*\(?([A-E])\)?[\.\)\-]\s+/g;
    let optMatch;
    const optPositions = [];

    while ((optMatch = optRegex.exec(statementAndOptions)) !== null) {
      optPositions.push({ letter: optMatch[1].toUpperCase(), index: optMatch.index, len: optMatch[0].length });
    }

    let enunciado = statementAndOptions;
    const options = { a: "", b: "", c: "", d: "", e: "" };

    if (optPositions.length >= 2) {
      enunciado = statementAndOptions.substring(0, optPositions[0].index).trim();

      for (let j = 0; j < optPositions.length; j++) {
        const curOpt = optPositions[j];
        const nextOptIdx = optPositions[j+1] ? optPositions[j+1].index : statementAndOptions.length;
        const optText = statementAndOptions.substring(curOpt.index + curOpt.len, nextOptIdx).trim();
        const key = curOpt.letter.toLowerCase();
        if (options[key] === "") {
          options[key] = optText.replace(/\n+/g, ' ');
        }
      }
    }

    questions.push({
      id: cur.num,
      texto_apoio: currentSupportText,
      enunciado: enunciado.replace(/\n+/g, ' '),
      alternativas: options,
      resposta_correta: "" // Será preenchido manualmente ou pelo gabarito
    });
  }

  // Remove duplicados mantendo a ordem das questões
  const unique = [];
  const seen = new Set();
  for (const q of questions) {
    if (!seen.has(q.id)) {
      seen.add(q.id);
      unique.push(q);
    }
  }

  return unique.sort((a,b) => a.id - b.id);
}

// 3. RENDERIZAR TELA DE REVISÃO
function renderPreview() {
  const container = document.getElementById('previewArea');
  container.innerHTML = "";

  parsedQuestions.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.innerHTML = `
      <div class="q-header">Questão ${q.id}</div>
      
      ${q.texto_apoio ? `
        <label style="font-size:0.85rem; color:#818cf8;">Texto de Interpretação / Apoio:</label>
        <textarea rows="4" onchange="parsedQuestions[${idx}].texto_apoio = this.value">${q.texto_apoio}</textarea>
      ` : ''}

      <label style="font-size:0.85rem; color:var(--text-muted);">Enunciado:</label>
      <textarea rows="3" onchange="parsedQuestions[${idx}].enunciado = this.value">${q.enunciado}</textarea>

      <div class="opt-grid">
        ${['a','b','c','d','e'].map(letter => `
          <div class="opt-row">
            <span class="opt-label">${letter.toUpperCase()})</span>
            <input type="text" style="flex:1; background:#0f172a; border:1px solid var(--border); color:#fff; padding:0.4rem; border-radius:4px;" 
                   value="${q.alternativas[letter] || ''}" 
                   onchange="parsedQuestions[${idx}].alternativas['${letter}'] = this.value">
          </div>
        `).join('')}
      </div>
    `;
    container.appendChild(card);
  });
}

// 4. DOWNLOAD DO JSON FINAL
document.getElementById('downloadBtn').addEventListener('click', () => {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(parsedQuestions, null, 2));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", "questoes.json");
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
});
</script>
</body>
</html>
