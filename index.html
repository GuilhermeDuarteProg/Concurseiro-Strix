<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Concursos</title>
  <link rel="stylesheet" href="style.css">
  <!-- Fonte moderna Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Cabeçalho Principal -->
  <header class="app-header">
    <div class="header-brand">
      <span class="logo-icon">🎯</span>
      <h1>Simulado<span>Concursos</span></h1>
    </div>

    <div class="header-controls">
      <!-- Seletor de Simulado -->
      <select id="seletorProvas" onchange="carregarProva(this.value)">
        <!-- Preenchido via JS -->
      </select>

      <!-- Alternador de Tema (Dark Mode) -->
      <button id="btn-theme" class="btn-icon" onclick="toggleTheme()" title="Alternar Tema">
        🌙
      </button>
    </div>
  </header>

  <!-- Barra de Ferramentas de Estudo -->
  <section class="toolbar">
    <div class="toolbar-group">
      <!-- Filtro de Disciplina -->
      <label for="filtroDisciplina">Matéria:</label>
      <select id="filtroDisciplina" onchange="aplicarFiltroDisciplina(this.value)">
        <option value="todas">Todas as Disciplinas</option>
      </select>
    </div>

    <div class="toolbar-group">
      <!-- Alternador de Modo: Estudo vs Simulado -->
      <label class="switch-label">
        <input type="checkbox" id="chkModoEstudo" checked onchange="toggleModoEstudo(this.checked)">
        <span>Modo Treino (Gabarito na Hora)</span>
      </label>
    </div>

    <div class="toolbar-group">
      <!-- Botão de Marcação para Revisão -->
      <button id="btn-revisar" class="btn-revisar" onclick="toggleRevisao()">
        🏳️ Marcar p/ Revisão
      </button>
    </div>
  </section>

  <!-- Área Principal do Simulado -->
  <main id="area-estudo" class="main-container oculto">
    
    <!-- Painel Esquerdo: Texto de Apoio / Interpretação -->
    <aside id="texto-apoio" class="painel-texto">
      <!-- O texto de suporte é injetado via JS quando existir -->
    </aside>

    <!-- Painel Direito: Questão e Alternativas -->
    <section class="painel-questao">
      <div class="questao-header">
        <span id="info-disciplina" class="badge-disciplina">Disciplina</span>
        <span class="dica-mouse">💡 <i>Clique com o botão direito para riscar uma opção.</i></span>
      </div>

      <div id="enunciado" class="enunciado-texto">
        Selecione uma prova no menu superior para começar a responder.
      </div>

      <!-- Lista de Opções -->
      <div id="opcoes" class="opcoes-list">
        <!-- Renderizado dinamicamente via JS -->
      </div>
    </section>

  </main>

  <!-- TELA DE CORREÇÃO E RESULTADO (Estilo Detran / Dark Mode) -->
  <div id="tela-resultado" class="oculto">
    
    <!-- Banner Superior de Pontuação -->
    <div class="resultado-header-card">
      <div class="score-main">
        <span id="resultado-porcentagem" class="porcentagem-destaque">0%</span>
        <p id="resultado-detalhe-texto">Você acertou 0 de 0 questões</p>
      </div>
      <div id="badge-desempenho" class="status-desempenho">--</div>
    </div>

    <!-- Grid Numérico de Navegação pelo Gabarito -->
    <div class="container-grid-gabarito">
      <p class="instrucao-grid">CLIQUE SOBRE A QUESTÃO DESEJADA E CONFIRA O GABARITO</p>
      <div id="grid-numeros-gabarito" class="grid-numeros"></div>
    </div>

    <!-- Card da Questão Selecionada no Gabarito -->
    <div id="painel-revisao-questao" class="card-revisao">
      <!-- Renderizado via JavaScript -->
    </div>

    <!-- Botões de Ação -->
    <div class="acoes-resultado">
      <button onclick="voltarAoSimulado()" class="btn-acao-secundario">← Voltar ao Simulado</button>
    </div>

  </div>

  <!-- Rodapé Fixado para Navegação -->
  <footer class="app-footer">
    <button class="btn-nav" onclick="mudarQuestao(-1)">◀ Anterior</button>
    <span id="contador-questoes">Questão 0 de 0</span>
    <button class="btn-nav" onclick="mudarQuestao(1)">Próxima ▶</button>
    <button class="btn-finalizar" onclick="calcularResultado()">📊 Finalizar e Ver Nota</button>
  </footer>

  <script src="script.js"></script>
  <script>
    // Script rápido para controle de Tema (Light / Dark)
    function toggleTheme() {
      const html = document.documentElement;
      const themeAtual = html.getAttribute('data-theme');
      const novoTema = themeAtual === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', novoTema);
      document.getElementById('btn-theme').innerText = novoTema === 'dark' ? '☀️' : '🌙';
    }
  </script>
</body>
</html>
